<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Calendario Personal</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="app">
  <header class="topbar">
    <div>
      <div class="eyebrow">MI CALENDARIO PERSONAL</div>
      <h1 id="currentDate"></h1>
      <p id="currentYear"></p>
    </div>
    <button class="ghost-btn" id="settingsBtn">•••</button>
  </header>

  <section class="navigation">
    <div class="day-buttons">
      <button id="prevDay" class="square-btn">‹</button>
      <button id="nextDay" class="square-btn">›</button>
    </div>
    <div class="filters">
      <button data-filter="today" class="filter active">Hoy</button>
      <button data-filter="future" class="filter">Próximos</button>
      <button data-filter="past" class="filter">Pasados</button>
      <button data-filter="all" class="filter">Todas</button>
      <button id="datePickerBtn" class="filter">📅</button>
    </div>
  </section>

  <section class="notes-section">
    <div class="section-title">
      <h2>📌 IMPORTANTES</h2>
    </div>
    <div id="priorityList"></div>
  </section>

  <section class="notes-section">
    <div class="section-title">
      <h2>📝 NOTAS</h2>
      <button class="mini-add" id="addNoteBtn">＋</button>
    </div>
    <div id="notesList"></div>
  </section>

  <section>
    <div class="section-title">
      <h2 id="sectionTitle">PENDIENTES DE HOY</h2>
      <span id="taskCount"></span>
    </div>
    <div id="taskList"></div>
  </section>
</main>

<button id="addBtn" class="add-btn">＋ Agregar pendiente</button>

<dialog id="taskDialog" class="dialog">
  <div class="dialog-head">
    <div>
      <div class="eyebrow">NUEVO PENDIENTE</div>
      <h2>Agregar pendiente</h2>
    </div>
    <button class="close-btn" id="closeDialog">×</button>
  </div>

  <form id="taskForm">
    <label>
      ¿Qué tienes que hacer?
      <input id="title" required placeholder="Ej. Enviar constancia">
    </label>

    <label>
      Fecha
      <div class="calendar-picker" id="calendarPicker"></div>
      <input id="taskDate" type="hidden" required>
    </label>

    <label>
      Hora
      <input id="taskTime" type="time" required>
    </label>

    <label>
      Repetición
      <select id="repeat">
        <option value="once">Una vez</option>
        <option value="daily">Todos los días</option>
        <option value="weekdays">Lunes a viernes</option>
        <option value="weekly">Cada semana</option>
      </select>
    </label>

    <label>
      Aviso
      <select id="reminder">
        <option value="10">10 minutos antes + a la hora</option>
        <option value="5">5 minutos antes + a la hora</option>
        <option value="15">15 minutos antes + a la hora</option>
        <option value="30">30 minutos antes + a la hora</option>
        <option value="0">Solo a la hora</option>
        <option value="none">Sin aviso</option>
      </select>
    </label>

    <button class="primary-btn" type="submit">Guardar pendiente</button>
  </form>
</dialog>

<dialog id="taskDetailDialog" class="dialog">
  <div id="detailContent"></div>
</dialog>

<dialog id="extrasDialog" class="dialog">
  <div id="extrasContent"></div>
</dialog>

<dialog id="noteDialog" class="dialog">
  <div class="dialog-head">
    <div>
      <div class="eyebrow">NOTAS</div>
      <h2 id="noteDialogTitle">Nueva nota</h2>
    </div>
    <button class="close-btn" id="closeNoteDialog">×</button>
  </div>

  <form id="noteForm">
    <label>
      Título
      <input id="noteTitle" required placeholder="Ej. Link importante">
    </label>

    <label>
      Nota
      <textarea id="noteText" rows="5" placeholder="Escribe algo que quieras guardar…"></textarea>
    </label>

    <label>
      Link (opcional)
      <input id="noteLink" type="url" placeholder="https://...">
    </label>

    <label class="check-label">
      <input id="notePinned" type="checkbox">
      📌 Marcar como prioridad
    </label>

    <button class="primary-btn">Guardar nota</button>
  </form>
</dialog>

<dialog id="noteDetailDialog" class="dialog">
  <div id="noteDetailContent"></div>
</dialog>

<dialog id="calendarDialog" class="dialog">
  <div class="dialog-head">
    <div>
      <div class="eyebrow">CALENDARIO</div>
      <h2>Elegir fecha</h2>
    </div>
    <button class="close-btn" id="closeCalendarDialog">×</button>
  </div>

  <div class="calendar-picker browse-calendar" id="browseCalendar"></div>
</dialog>

<script src="app.js"></script>
</body>
</html>
